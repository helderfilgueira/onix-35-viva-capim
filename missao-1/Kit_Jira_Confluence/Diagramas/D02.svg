<rect x="24" y="62" width="354" height="118" rx="12" fill="#FFFFFF" stroke="#B9C8C5" stroke-width="2"/>
<text x="40" y="97" fill="#1B282D" font-size="25" font-weight="700" text-anchor="start">Web pública</text>
<text x="40" y="128" fill="#45565A" font-size="22" font-weight="400" text-anchor="start">Agenda, detalhe, mapa</text>
