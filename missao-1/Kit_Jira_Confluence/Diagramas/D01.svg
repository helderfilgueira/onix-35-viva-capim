<text x="636" y="354" fill="#45565A" font-size="22" font-weight="400" text-anchor="start">Voltar à consulta</text>
<text x="636" y="381" fill="#45565A" font-size="22" font-weight="400" text-anchor="start">Recusa não coleta</text>
<polyline points="1047,416 1047,452 451,452 451,416" fill="none" stroke="#45616A" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="451.0,416.0 444.5,427.3 457.5,427.3" fill="#45616A"/>
<text x="697" y="479" fill="#45565A" font-size="20" font-weight="700" text-anchor="start">Confirmar gravação no servidor</text>
<rect x="322" y="288" width="258" height="128" rx="12" fill="#E6EEF1" stroke="#B9C8C5" stroke-width="2"/>
<text x="338" y="323" fill="#1B282D" font-size="25" font-weight="700" text-anchor="start">Recebida</text>
<text x="338" y="354" fill="#45565A" font-size="22" font-weight="400" text-anchor="start">Mostrar confirmação</text>
<text x="338" y="381" fill="#45565A" font-size="22" font-weight="400" text-anchor="start">Recibo só se pedido</text>
<rect x="24" y="288" width="258" height="128" rx="12" fill="#173A35"/>
<text x="40" y="323" fill="#FFFFFF" font-size="25" font-weight="700" text-anchor="start">Finalizar</text>
<text x="40" y="354" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="start">Limpar o atendimento</text>
<text x="40" y="381" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="start">Voltar ao início</text>
<rect x="24" y="490" width="1152" height="44" rx="9" fill="#EEF3DE"/>
<text x="42" y="519" fill="#1B282D" font-size="21" font-weight="700" text-anchor="start">Acesso à agenda, ao local e ao QR público não depende de avaliação.</text>
