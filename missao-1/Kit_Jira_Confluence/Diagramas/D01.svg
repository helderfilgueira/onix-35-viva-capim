<polygon points="749.0,288.0 755.5,276.7 742.5,276.7" fill="#AB7600"/>
<text x="765" y="258" fill="#AB7600" font-size="20" font-weight="700" text-anchor="start">Recusa</text>
<polyline points="322,352 282,352" fill="none" stroke="#45616A" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="282.0,352.0 293.3,358.5 293.3,345.5" fill="#45616A"/>
<rect x="24" y="64" width="258" height="128" rx="12" fill="#FFFFFF" stroke="#B9C8C5" stroke-width="2"/>
<text x="40" y="99" fill="#1B282D" font-size="25" font-weight="700" text-anchor="start">Entrada</text>
<text x="40" y="130" fill="#45565A" font-size="22" font-weight="400" text-anchor="start">Celular ou totem</text>
<text x="40" y="157" fill="#45565A" font-size="22" font-weight="400" text-anchor="start">Sem cadastro</text>
<rect x="322" y="64" width="258" height="128" rx="12" fill="#FFFFFF" stroke="#B9C8C5" stroke-width="2"/>
<text x="338" y="99" fill="#1B282D" font-size="25" font-weight="700" text-anchor="start">Agenda</text>
<text x="338" y="130" fill="#45565A" font-size="22" font-weight="400" text-anchor="start">Buscar e filtrar</text>
<text x="338" y="157" fill="#45565A" font-size="22" font-weight="400" text-anchor="start">Ver eventos disponíveis</text>
<rect x="620" y="64" width="258" height="128" rx="12" fill="#FFFFFF" stroke="#B9C8C5" stroke-width="2"/>
<text x="636" y="99" fill="#1B282D" font-size="25" font-weight="700" text-anchor="start">Detalhe e local</text>
