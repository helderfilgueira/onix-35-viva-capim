<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="546" viewBox="0 0 1200 546" role="img">
<title>Jornada do visitante</title>
<desc>A agenda permanece aberta quando a pessoa recusa a avaliação. Só a resposta confirmada encerra o envio como recebido.</desc>
<rect x="0" y="0" width="1200" height="546" rx="20" fill="#F5F8F7"/>
<g font-family="Arial, sans-serif">
