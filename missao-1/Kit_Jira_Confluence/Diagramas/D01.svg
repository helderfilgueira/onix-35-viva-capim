<text x="934" y="99" fill="#1B282D" font-size="25" font-weight="700" text-anchor="start">Aviso de coleta</text>
<text x="934" y="130" fill="#45565A" font-size="22" font-weight="400" text-anchor="start">Se quiser avaliar</text>
<text x="934" y="157" fill="#45565A" font-size="22" font-weight="400" text-anchor="start">Entender finalidade</text>
