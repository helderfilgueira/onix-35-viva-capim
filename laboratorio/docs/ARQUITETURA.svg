<text x="68" y="261" font-family="Arial,sans-serif" font-size="16" fill="#345444">Sem cadastro para navegar</text><rect x="450" y="150" width="320" height="160" rx="18" fill="white" stroke="#a9bfb1" stroke-width="2"/><rect x="450" y="150" width="7" height="160" rx="3" fill="#7ba16b"/><text x="470" y="184" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#173f32">Interface web</text><text x="470" y="213" font-family="Arial,sans-serif" font-size="16" fill="#345444">HTML / CSS / JavaScript</text><text x="470" y="237" font-family="Arial,sans-serif" font-size="16" fill="#345444">Three.js local + fallback SVG</text><text x="470" y="261" font-family="Arial,sans-serif" font-size="16" fill="#345444">Motion reduzido e lista acessível</text><rect x="450" y="400" width="320" height="170" rx="18" fill="white" stroke="#a9bfb1" stroke-width="2"/><rect x="450" y="400" width="7" height="170" rx="3" fill="#7ba16b"/><text x="470" y="434" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#173f32">API Python local</text><text x="470" y="463" font-family="Arial,sans-serif" font-size="16" fill="#345444">/api/navigation + /api/routes</text><text x="470" y="487" font-family="Arial,sans-serif" font-size="16" fill="#345444">Validação + Dijkstra</text><text x="470" y="511" font-family="Arial,sans-serif" font-size="16" fill="#345444">API de eventos preservada</text><rect x="870" y="150" width="280" height="160" rx="18" fill="white" stroke="#a9bfb1" stroke-width="2"/><rect x="870" y="150" width="7" height="160" rx="3" fill="#7ba16b"/><text x="890" y="184" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#173f32">Catálogo e grafo</text><text x="890" y="213" font-family="Arial,sans-serif" font-size="16" fill="#345444">Dados fictícios versionados</text><text x="890" y="237" font-family="Arial,sans-serif" font-size="16" fill="#345444">Lojas, praças e âncoras</text><text x="890" y="261" font-family="Arial,sans-serif" font-size="16" fill="#345444">Malha não decide a rota</text><rect x="870" y="400" width="280" height="170" rx="18" fill="white" stroke="#a9bfb1" stroke-width="2"/><rect x="870" y="400" width="7" height="170" rx="3" fill="#7ba16b"/><text x="890" y="434" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#173f32">Persistência existente</text><text x="890" y="463" font-family="Arial,sans-serif" font-size="16" fill="#345444">SQLite: eventos e avaliações</text><text x="890" y="487" font-family="Arial,sans-serif" font-size="16" fill="#345444">Tokens pseudônimos</text><text x="890" y="511" font-family="Arial,sans-serif" font-size="16" fill="#345444">Admin separado da consulta</text><rect x="48" y="400" width="300" height="170" rx="18" fill="white" stroke="#a9bfb1" stroke-width="2"/><rect x="48" y="400" width="7" height="170" rx="3" fill="#7ba16b"/><text x="68" y="434" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#173f32">Verificação independente</text><text x="68" y="463" font-family="Arial,sans-serif" font-size="16" fill="#345444">Regressão + testes de rotas</text><text x="68" y="487" font-family="Arial,sans-serif" font-size="16" fill="#345444">Jornada no navegador</text><text x="68" y="511" font-family="Arial,sans-serif" font-size="16" fill="#345444">Evidências antes de Done</text><text x="48" y="750" font-family="Arial,sans-serif" font-size="15" fill="#456354">Fronteira: servidor de demonstração em loopback. Não equivale a serviço de produção ou frota instalada.</text><text x="48" y="775" font-family="Arial,sans-serif" font-size="15" fill="#456354">Próximo piloto: HTTPS, operação autorizada, mapa público validado e gestão de dispositivos.</text><text x="48" y="800" font-family="Arial,sans-serif" font-size="15" fill="#456354">SVG editável produzido em código; diagramas representam contratos, não testes executados.</text></svg>