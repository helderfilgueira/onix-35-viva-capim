<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">Viva Capim · jornada de orientação</title><desc id="desc">Fluxo de interação proposto | Estados de localização explícitos | Em implementação</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#477160"/></marker></defs><rect width="1200" height="850" fill="#f4f4eb"/><text x="48" y="60" fill="#173f32" font-family="Arial,sans-serif" font-size="28" font-weight="700">Viva Capim · jornada de orientação</text><text x="48" y="94" fill="#456354" font-family="Arial,sans-serif" font-size="17">Fluxo de interação proposto | Estados de localização explícitos | Em implementação</text><path d="M348,225 L450,225" fill="none" stroke="#477160" stroke-width="3" marker-end="url(#arrow)"/><path d="M750,225 L850,225" fill="none" stroke="#477160" stroke-width="3" marker-end="url(#arrow)"/><path d="M1000,300 L1000,430" fill="none" stroke="#477160" stroke-width="3" marker-end="url(#arrow)"/><path d="M850,515 L750,515" fill="none" stroke="#477160" stroke-width="3" marker-end="url(#arrow)"/><path d="M450,515 L348,515" fill="none" stroke="#477160" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="150" width="300" height="150" rx="18" fill="white" stroke="#a9bfb1" stroke-width="2"/><rect x="48" y="150" width="7" height="150" rx="3" fill="#7ba16b"/><text x="68" y="184" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#173f32">1 · Explorar</text><text x="68" y="213" font-family="Arial,sans-serif" font-size="16" fill="#345444">Buscar loja ou evento</text><text x="68" y="237" font-family="Arial,sans-serif" font-size="16" fill="#345444">Selecionar pela lista ou mapa</text><text x="68" y="261" font-family="Arial,sans-serif" font-size="16" fill="#345444">Consulta sem cadastro</text><rect x="450" y="150" width="300" height="150" rx="18" fill="white" stroke="#a9bfb1" stroke-width="2"/><rect x="450" y="150" width="7" height="150" rx="3" fill="#7ba16b"/><text x="470" y="184" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#173f32">2 · Confirmar origem</text><text x="470" y="213" font-family="Arial,sans-serif" font-size="16" fill="#345444">Totem: ponto fixo</text><text x="470" y="237" font-family="Arial,sans-serif" font-size="16" fill="#345444">QR: último ponto confirmado</text><text x="470" y="261" font-family="Arial,sans-serif" font-size="16" fill="#345444">Manual: local selecionado</text><rect x="850" y="150" width="300" height="150" rx="18" fill="white" stroke="#a9bfb1" stroke-width="2"/><rect x="850" y="150" width="7" height="150" rx="3" fill="#7ba16b"/><text x="870" y="184" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#173f32">3 · Pedir percurso</text><text x="870" y="213" font-family="Arial,sans-serif" font-size="16" fill="#345444">Destino = entrada cadastrada</text><text x="870" y="237" font-family="Arial,sans-serif" font-size="16" fill="#345444">Preferência sem escadas</text><text x="870" y="261" font-family="Arial,sans-serif" font-size="16" fill="#345444">Versão de mapa validada</text><rect x="850" y="430" width="300" height="170" rx="18" fill="white" stroke="#a9bfb1" stroke-width="2"/><rect x="850" y="430" width="7" height="170" rx="3" fill="#7ba16b"/><text x="870" y="464" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#173f32">4 · Orientar</text><text x="870" y="493" font-family="Arial,sans-serif" font-size="16" fill="#345444">Percurso 3D / SVG / lista</text><text x="870" y="517" font-family="Arial,sans-serif" font-size="16" fill="#345444">Andares e marcos visuais</text><text x="870" y="541" font-family="Arial,sans-serif" font-size="16" fill="#345444">Sem caminho: informar falha</text><rect x="450" y="430" width="300" height="170" rx="18" fill="white" stroke="#a9bfb1" stroke-width="2"/><rect x="450" y="430" width="7" height="170" rx="3" fill="#7ba16b"/><text x="470" y="464" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#173f32">5 · Continuar</text><text x="470" y="493" font-family="Arial,sans-serif" font-size="16" fill="#345444">QR com IDs públicos</text><text x="470" y="517" font-family="Arial,sans-serif" font-size="16" fill="#345444">Sem sessão ou token no link</text><text x="470" y="541" font-family="Arial,sans-serif" font-size="16" fill="#345444">Loopback não abre outro celular</text><rect x="48" y="430" width="300" height="170" rx="18" fill="white" stroke="#a9bfb1" stroke-width="2"/><rect x="48" y="430" width="7" height="170" rx="3" fill="#7ba16b"/><text x="68" y="464" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#173f32">6 · Encerrar</text><text x="68" y="493" font-family="Arial,sans-serif" font-size="16" fill="#345444">Reset de busca e percurso</text><text x="68" y="517" font-family="Arial,sans-serif" font-size="16" fill="#345444">Aviso antes da inatividade</text><text x="68" y="541" font-family="Arial,sans-serif" font-size="16" fill="#345444">Novo visitante sem estado anterior</text><text x="48" y="750" font-family="Arial,sans-serif" font-size="15" fill="#456354">Eventos preservam participação e avaliação voluntárias em fluxo próprio; nota de evento não é nota da loja.</text><text x="48" y="775" font-family="Arial,sans-serif" font-size="15" fill="#456354">QR confirma um ponto: não mede movimento. Posicionamento contínuo depende de infraestrutura e validação.</text><text x="48" y="800" font-family="Arial,sans-serif" font-size="15" fill="#456354">A alternativa 2D/lista continua útil quando WebGL ou movimento estiverem indisponíveis.</text></svg>