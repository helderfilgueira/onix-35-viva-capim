services:
  db:
    image: postgres:16-alpine
    container_name: viva-capim-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: viva_capim
      POSTGRES_USER: viva
      POSTGRES_PASSWORD: viva_local
    ports:
      - "5432:5432"
    volumes:
      - viva_capim_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viva -d viva_capim"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  viva_capim_data:
